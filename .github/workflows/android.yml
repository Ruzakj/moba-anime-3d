name: Godot Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godot-android-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: barichello/godot-ci:4.4.1
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot Android toolchain
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/4.4.1.stable "$HOME/.local/share/godot/export_templates/"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF
          yes | sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -f /root/debug.keystore
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          java -version
          test -x "$ANDROID_HOME/platform-tools/adb"
      - name: Import project
        run: timeout 45s godot --headless --editor --quit-after 3
      - name: Validate project
        run: timeout 45s godot --headless -s res://tests/validate.gd
      - name: Playable match smoke test
        run: timeout 45s godot --headless -s res://tests/match_smoke.gd
      - name: Headless startup smoke test
        run: timeout 45s godot --headless --path . --quit-after 3
      - name: Export Android debug package
        run: mkdir -p build && timeout 180s godot --headless --export-debug "Android Debug" build/moba-anime-3d-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: moba-anime-3d-debug
          path: build/moba-anime-3d-debug.apk
