name: Godot Android APK
on:
  push:
    branches: [main, feature/asset-upgrade]
  workflow_dispatch:

concurrency:
  group: godot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify third-party assets
        run: |
          test -f third_party/kaykit_adventurers/addons/kaykit_character_pack_adventures/Characters/gltf/Knight.glb
          test -f third_party/kaykit_adventurers/addons/kaykit_character_pack_adventures/Characters/gltf/Mage.glb
          test -f third_party/kaykit_dungeon/addons/kaykit_dungeon_remastered/LICENSE.txt
          test -f third_party/kenney_particle_pack/addons/kenney_particle_pack/magic_01.png

      - name: Prepare Godot Android toolchain
        run: |
          set -eux
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/4.4.1.stable "$HOME/.local/share/godot/export_templates/"
          mkdir -p "$HOME/.config"
          rm -rf "$HOME/.config/godot"
          cp -a /root/.config/godot "$HOME/.config/godot"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"

      - name: Import project
        run: timeout 90s godot --headless --editor --quit-after 5

      - name: Validate project
        run: timeout 60s godot --headless -s res://tests/validate.gd

      - name: Playable match smoke test
        run: timeout 60s godot --headless -s res://tests/match_smoke.gd

      - name: Headless startup smoke test
        run: timeout 60s godot --headless --path . --quit-after 3

      - name: Export Android debug package
        run: |
          mkdir -p build
          timeout 240s godot --headless --verbose --export-debug "Android Debug" build/moba-anime-3d-debug.apk
          test -s build/moba-anime-3d-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose build/moba-anime-3d-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: moba-anime-3d-debug
          path: build/moba-anime-3d-debug.apk
          if-no-files-found: error
